services:
  - type: web
    name: activism-to-whatsapp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZAI_BASE_URL
        value: https://api.z.ai/api/coding/paas/v4
      - key: GLM_MODEL
        value: glm-5.2
      - key: ZAI_API_KEY
        sync: false
      - key: FOOTER_TEXT
        sync: false
